name = "quatt-sales-support-tool"

# Secrets (set in the Cloudflare Pages dashboard, not here), per environment:
#   HUBSPOT_TOKEN_PROD / HUBSPOT_TOKEN  HubSpot Private App token
#   SESSION_SECRET  signs 12h login sessions (functions/api/_middleware.js). Use a different
#                   random value on production and preview. Unset = reps re-login every hour.
#   SYNC_SECRET     lets sandbox's /api/sync-from-prod read production's playbooks, schedulers
#                   and feedback. Same random value on both environments.
compatibility_date = "2024-09-23"
pages_build_output_dir = "./out"

# Production KV — production ONLY. Never re-declare this ID under [env.preview]:
# sandbox tests leaked into production data when preview shared it (2026-09-23).
[[kv_namespaces]]
binding = "PLAYBOOKS_KV"
id = "313049fad0e849eba6b68dca3fec9131"

[vars]
NEXT_PUBLIC_LTO_STAGE_ID = "6021605583"
APP_ENV = "production"

[env.preview.vars]
NEXT_PUBLIC_LTO_STAGE_ID = "6020017392"
APP_ENV = "sandbox"
# One-way prod → sandbox copy (/api/sync-from-prod) reads production over these public GET endpoints
PROD_ORIGIN = "https://quatt-sales-support-tool.pages.dev"

# kv_namespaces is non-inheritable: preview only gets the bindings declared here.
# Sandbox-only namespace "qst-sandbox-kv" (created 2026-09-23). Fill it from production
# with the admin panel's "Copy production data" button (/api/sync-from-prod, one-way).
[[env.preview.kv_namespaces]]
binding = "PLAYBOOKS_KV"
id = "a305e676e03d402092bbd411568ea0e1"
